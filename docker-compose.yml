services:
  redis:
    image: redis:7-alpine
    container_name: finsty-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
    container_name: finsty-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data: