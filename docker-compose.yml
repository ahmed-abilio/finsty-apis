services:
  redis:
    image: redis:7-alpine
    container_name: finsty-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./finsty-apis
    container_name: finsty-api
    restart: unless-stopped
    env_file:
      - ./finsty-apis/.env
    environment:
      # Container-level overrides so the app binds correctly and talks to the redis service
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "3000:3000"
    volumes:
      # Mount Firebase credentials at the path referenced by FIREBASE_SERVICE_ACCOUNT_PATH
      - ./finsty-apis/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./finsty-admin-fe
      args:
        # Point the admin UI at this EC2 host's API. Override for your public IP/domain.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-Finsty Admin}
    container_name: finsty-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  redis-data:
